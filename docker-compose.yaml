services:
  keel:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - provider-aws
    volumes:
      - ./resources:/resources:ro
    environment:
      - LOG_LEVEL=info
    command:
      - --repo=/resources
      - --poll-interval=10s
      - --providers=aws.keel.dev=provider-aws:50051
      - --workers=2
      - --log-level=info

  provider-aws:
    build:
      context: .
      dockerfile: providers/aws/Dockerfile
    ports:
      - "50051:50051"
    environment:
      - AWS_REGION=${AWS_REGION:-ap-northeast-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    command:
      - --addr=:50051
      - --region=${AWS_REGION:-ap-northeast-1}
